<script>
    
    // Sets "long-life" cookie (expires December 31th, 2020)
    function setCookie(name, value) {
        var cookie_string = name + "=" + escape(value);
        cookie_string += "; expires=" + new Date(2020, 12, 31).toGMTString();
        cookie_string += "; domain=.visualvm.dev.java.net";
        cookie_string += "; path=/";
        document.cookie = cookie_string;
    }

    // Gets cookie
    function getCookie(name) {
        var results = document.cookie.match ('(^|;) ?' + name + '=([^;]*)(;|$)');
        if (results) return unescape(results[2]);
        else return null;
    }
    
    var DISABLE_VISUALVM_THEME = "disable_visualvm_theme_cookie";
    var disableTheme = getCookie(DISABLE_VISUALVM_THEME);
    
    // Enables custom theme
    function customTheme() {
        setCookie(DISABLE_VISUALVM_THEME, "false");
        history.go(0);
    }

    // Disables custom theme
    function defaultTheme() {
        setCookie(DISABLE_VISUALVM_THEME, "true");
        history.go(0);
    }
    
    document.title = "visualvm: переключатель темы проекта";
    
    var html =  "<h1>Переключатель темы проекта</h1> <br><p>Текущая тема: <b>" + (disableTheme != "true" ? "настроенная тема VisualVM" : "стандартная тема dev.java.net") + "</b><br>"
    if (disableTheme != "true")
        html += "Переключить на <a href=\"javascript:defaultTheme();\"><b>стандартную тему dev.java.net</b></a>"
    else
        html += "Переключить на <a href=\"javascript:customTheme();\"><b>настроенную тему VisualVM</b></a>"
    html += "</p>"
    document.write(html);
    
</script>
