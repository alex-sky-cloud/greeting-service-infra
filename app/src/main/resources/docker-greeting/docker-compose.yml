services:
  postgres:
    image: postgres:16.4
    container_name: local-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Создаёт БД reactive_demo на том же PostgreSQL (идемпотентно при каждом compose up).
  # Init-скрипты в initdb/ срабатывают только на пустом volume — этот сервис нужен для уже существующих данных.
  reactive-demo-db-init:
    image: postgres:16.4
    container_name: reactive-demo-db-init
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 <<-'EOSQL'
          SELECT 'CREATE DATABASE reactive_demo OWNER app'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'reactive_demo')\gexec
        EOSQL
        echo "reactive_demo: OK"
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:8.9
    container_name: local-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: