plugins {
    id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 27
}

tasks.named('test') {
    useJUnitPlatform()
    // Тесты замеряют время и аллокации: параллельный запуск классов исказил бы замеры.
    maxParallelForks = 1
    jvmArgs '-Xmx512m', '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    testLogging {
        events = ['failed']
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

// Путь к JDK 27, на котором собирается курс: его jcmd, jstat и jfr подключаются к лаборатории.
def courseJdk = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(27) }

tasks.register('javaHome') {
    group = 'help'
    description = 'Печатает путь к JDK 27 курса'
    doLast {
        println courseJdk.get().metadata.installationPath.asFile.absolutePath
    }
}
