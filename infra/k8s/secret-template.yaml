# =============================================================================
# secret-template.yaml — шаблоны Secret (не коммитить реальные пароли).
#
# greeting-service:
#   kubectl create secret generic greeting-service-secret ...
#
# reactive-demo (нужен R2DBC_URL):
#   kubectl create secret generic reactive-demo-secret \
#     --from-literal=DB_URL="jdbc:postgresql://10.10.0.5:5432/reactive_demo" \
#     --from-literal=R2DBC_URL="r2dbc:postgresql://10.10.0.5:5432/reactive_demo" \
#     --from-literal=DB_USERNAME="greeting_user" \
#     --from-literal=DB_PASSWORD="your_password"
#
# Или: bash scripts/create-secrets.sh (создаёт оба Secret)
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: greeting-service-secret
  namespace: prod
type: Opaque
data:
  DB_URL: amRiYzpwb3N0Z3Jlc3FsOi8vMTAuMTAuMC41OjU0MzIvZ3JlZXRpbmdfZGI=
  DB_USERNAME: Z3JlZXRpbmdfdXNlcg==
  DB_PASSWORD: Y2hhbmdlX21l
---
apiVersion: v1
kind: Secret
metadata:
  name: reactive-demo-secret
  namespace: prod
type: Opaque
data:
  DB_URL: amRiYzpwb3N0Z3Jlc3FsOi8vMTAuMTAuMC41OjU0MzIvcmVhY3RpdmVfZGVtbw==
  R2DBC_URL: cjJkYmM6cG9zdGdyZXNxbDovLzEwLjEwLjAuNTo1NDMyL3JlYWN0aXZlX2RlbW8=
  DB_USERNAME: Z3JlZXRpbmdfdXNlcg==
  DB_PASSWORD: Y2hhbmdlX21l
