# =============================================================================
# values-dev.yaml — переопределения для окружения dev.
# Применяется командой:
#   helm upgrade --install greeting-service ./greeting-service \
#     -f values.yaml -f values-dev.yaml \
#     --namespace dev --create-namespace
# =============================================================================

replicaCount: 1

image:
  # Docker Registry на devtools (terraform output devtools_public_ip).
  repository: 72.56.249.137:5000/greeting-service
  # Тег НЕ dev-latest: его нет в registry при ручной сборке (Раздел 12).
  # Перед helm upgrade проверьте: curl -s -u docker:docker http://<IP>:5000/v2/greeting-service/tags/list
  # Pipeline (ci/.gitlab-ci.yml) задаёт тег через --set image.tag=$CI_COMMIT_SHORT_SHA.
  tag: "manual-v8"

ingress:
  host: greeting-dev.cloud-terra.online

env:
  APP_ENV: "dev"
  APP_VERSION: "dev"

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Первый запуск: Flyway накатывает 18 миграций (~1–2 мин на managed PG).
livenessProbe:
  initialDelaySeconds: 120
  periodSeconds: 15
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 90
  periodSeconds: 10
  failureThreshold: 6
