server:
  port: 8081

app:
  env: ${APP_ENV:local}
  version: ${APP_VERSION:unknown}

spring:
  application:
    name: reactive-demo
  r2dbc:
    url: ${R2DBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    # JDBC URL обязателен: при R2DBC Spring Boot не создаёт DataSource (spring.datasource.* игнорируется).
    url: ${DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    schemas: reactive_demo
    default-schema: reactive_demo
    create-schemas: true
    baseline-on-migrate: true

logging:
  pattern:
    console: '%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n'
  level:
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql.QUERY: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
