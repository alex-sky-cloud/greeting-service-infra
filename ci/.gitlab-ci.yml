# =============================================================================
# ci/.gitlab-ci.yml — CI/CD pipeline для монорепозитория greeting-service-infra
#
# Где лежит файл и что GitLab считает «корнем»:
#   • GitLab-проект greeting-group/greeting-service — это ВЕСЬ репозиторий
#     (app/ + infra/ + ci/ + scripts/ + docs/), а не только папка app/.
#   • Корень репозитория ($CI_PROJECT_DIR) — каталог greeting-service-infra/
#     на диске; все пути cd app, infra/helm/... — относительно него.
#   • Файл хранится в ci/ по структуре проекта (Раздел 5 руководства).
#   • В GitLab указать путь к конфигурации:
#     Project → Settings → General → CI/CD → CI/CD configuration file
#     → ci/.gitlab-ci.yml
#
# Runner: self-hosted на devtools, executor shell (Раздел 11a).
#   Job выполняется на сервере от пользователя gitlab-runner, без Docker-образов
#   job-ов и без docker-in-docker. Нужно на devtools:
#     • Docker (cloud-init), пользователь gitlab-runner в группе docker
#     • Java 21 для Gradle (Gradle toolchain скачает JDK при первом запуске)
#     • helm и kubectl (для deploy-*)
#
# Переменные (Project → Settings → CI/CD → Variables):
#   REGISTRY_HOST       — 72.56.249.137:5000
#   REGISTRY_USER       — docker
#   REGISTRY_PASSWORD   — docker (Masked)
#   IMAGE_NAME          — greeting-service
#   REACTIVE_DEMO_IMAGE_NAME — reactive-demo (опционально, по умолчанию reactive-demo)
#   HELM_RELEASE_NAME   — greeting-service
#   REACTIVE_DEMO_HELM_RELEASE — reactive-demo
#   KUBE_CONFIG_BASE64  — base64 kubeconfig (timeweb-greeting.yaml)
# =============================================================================

default:
  tags:
    - self-hosted   # runner devtools-runner (тег из Раздела 11a)

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  REACTIVE_DEMO_IMAGE_NAME: "reactive-demo"
  REACTIVE_DEMO_HELM_RELEASE: "reactive-demo"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/

stages:
  - build
  - docker
  - deploy

# ── Сборка и тесты (Gradle в app/) ───────────────────────────────────────────
build-and-test:
  stage: build
  script:
    - cd app
    - chmod +x ./gradlew
    - ./gradlew clean test bootJar --no-daemon
    - cp build/libs/app.jar ../greeting-service.jar
  artifacts:
    name: "greeting-service-jar-$CI_COMMIT_SHORT_SHA"
    paths:
      - greeting-service.jar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build-and-test-reactive-demo:
  stage: build
  script:
    - cd reactive-demo
    - chmod +x ./gradlew
    - ./gradlew clean test bootJar --no-daemon
    - cp build/libs/reactive-demo.jar ../reactive-demo.jar
  artifacts:
    name: "reactive-demo-jar-$CI_COMMIT_SHORT_SHA"
    paths:
      - reactive-demo.jar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Docker build/push — docker на хосте devtools (shell executor) ───────────
build-and-push-docker:
  stage: docker
  needs:
    - build-and-test
  script:
    - export IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
    - export FULL_IMAGE="${REGISTRY_HOST}/${IMAGE_NAME}:${IMAGE_TAG}"
    - echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY_HOST}" -u "${REGISTRY_USER}" --password-stdin
    - cd app
    - docker build -t "${FULL_IMAGE}" .
    - docker tag "${FULL_IMAGE}" "${REGISTRY_HOST}/${IMAGE_NAME}:latest"
    - docker push "${FULL_IMAGE}"
    - docker push "${REGISTRY_HOST}/${IMAGE_NAME}:latest"
    - echo "${IMAGE_TAG}" > ../image_tag.txt
  artifacts:
    name: "image-tag-$CI_COMMIT_SHORT_SHA"
    paths:
      - image_tag.txt
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build-and-push-docker-reactive-demo:
  stage: docker
  needs:
    - build-and-test-reactive-demo
  script:
    - export IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
    - export FULL_IMAGE="${REGISTRY_HOST}/${REACTIVE_DEMO_IMAGE_NAME}:${IMAGE_TAG}"
    - echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY_HOST}" -u "${REGISTRY_USER}" --password-stdin
    - cd reactive-demo
    - docker build -t "${FULL_IMAGE}" .
    - docker tag "${FULL_IMAGE}" "${REGISTRY_HOST}/${REACTIVE_DEMO_IMAGE_NAME}:latest"
    - docker push "${FULL_IMAGE}"
    - docker push "${REGISTRY_HOST}/${REACTIVE_DEMO_IMAGE_NAME}:latest"
    - echo "${IMAGE_TAG}" > ../reactive_demo_image_tag.txt
  artifacts:
    name: "reactive-demo-image-tag-$CI_COMMIT_SHORT_SHA"
    paths:
      - reactive_demo_image_tag.txt
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Деплой в dev (helm/kubectl на хосте devtools) ───────────────────────────
deploy-dev:
  stage: deploy
  needs:
    - build-and-push-docker
  before_script:
    - mkdir -p ~/.kube
    - echo "${KUBE_CONFIG_BASE64}" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - export IMAGE_TAG=$(cat image_tag.txt)
    - |
      helm upgrade --install "${HELM_RELEASE_NAME}" infra/helm/greeting-service \
        --namespace dev \
        --create-namespace \
        -f infra/helm/greeting-service/values.yaml \
        -f infra/helm/greeting-service/values-dev.yaml \
        --set image.repository="${REGISTRY_HOST}/${IMAGE_NAME}" \
        --set image.tag="${IMAGE_TAG}" \
        --atomic \
        --timeout 5m
    - kubectl rollout status deployment/"${HELM_RELEASE_NAME}" -n dev --timeout=300s
  environment:
    name: dev
    url: http://greeting-dev.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-dev-reactive-demo:
  stage: deploy
  needs:
    - build-and-push-docker-reactive-demo
  before_script:
    - mkdir -p ~/.kube
    - echo "${KUBE_CONFIG_BASE64}" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - export IMAGE_TAG=$(cat reactive_demo_image_tag.txt)
    - |
      helm upgrade --install "${REACTIVE_DEMO_HELM_RELEASE}" infra/helm/reactive-demo \
        --namespace dev \
        --create-namespace \
        -f infra/helm/reactive-demo/values.yaml \
        -f infra/helm/reactive-demo/values-dev.yaml \
        --set image.repository="${REGISTRY_HOST}/${REACTIVE_DEMO_IMAGE_NAME}" \
        --set image.tag="${IMAGE_TAG}" \
        --atomic \
        --timeout 5m
    - kubectl rollout status deployment/"${REACTIVE_DEMO_HELM_RELEASE}-reactive-demo" -n dev --timeout=300s
  environment:
    name: dev/reactive-demo
    url: http://reactive-demo-dev.cloud-terra.online
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ── Деплой в prod (ручной запуск) ───────────────────────────────────────────
deploy-prod:
  stage: deploy
  needs:
    - build-and-push-docker
  before_script:
    - mkdir -p ~/.kube
    - echo "${KUBE_CONFIG_BASE64}" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - export IMAGE_TAG=$(cat image_tag.txt)
    - |
      helm upgrade --install "${HELM_RELEASE_NAME}" infra/helm/greeting-service \
        --namespace prod \
        --create-namespace \
        -f infra/helm/greeting-service/values.yaml \
        -f infra/helm/greeting-service/values-prod.yaml \
        --set image.repository="${REGISTRY_HOST}/${IMAGE_NAME}" \
        --set image.tag="${IMAGE_TAG}" \
        --atomic \
        --timeout 10m
    - kubectl rollout status deployment/"${HELM_RELEASE_NAME}" -n prod --timeout=600s
  environment:
    name: prod
    url: http://greeting.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

deploy-prod-reactive-demo:
  stage: deploy
  needs:
    - build-and-push-docker-reactive-demo
  before_script:
    - mkdir -p ~/.kube
    - echo "${KUBE_CONFIG_BASE64}" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - export IMAGE_TAG=$(cat reactive_demo_image_tag.txt)
    - |
      helm upgrade --install "${REACTIVE_DEMO_HELM_RELEASE}" infra/helm/reactive-demo \
        --namespace prod \
        --create-namespace \
        -f infra/helm/reactive-demo/values.yaml \
        -f infra/helm/reactive-demo/values-prod.yaml \
        --set image.repository="${REGISTRY_HOST}/${REACTIVE_DEMO_IMAGE_NAME}" \
        --set image.tag="${IMAGE_TAG}" \
        --atomic \
        --timeout 10m
    - kubectl rollout status deployment/"${REACTIVE_DEMO_HELM_RELEASE}-reactive-demo" -n prod --timeout=600s
  environment:
    name: prod/reactive-demo
    url: http://reactive-demo.cloud-terra.online
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# ── Откат prod ──────────────────────────────────────────────────────────────
rollback-prod:
  stage: deploy
  before_script:
    - mkdir -p ~/.kube
    - echo "${KUBE_CONFIG_BASE64}" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - helm rollback "${HELM_RELEASE_NAME}" -n prod
    - kubectl rollout status deployment/"${HELM_RELEASE_NAME}" -n prod --timeout=300s
  environment:
    name: prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
